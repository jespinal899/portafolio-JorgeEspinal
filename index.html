<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Jorge Espinal: Administrador de Sistemas, Soporte TI y Desarrollo de Software en Honduras."
    />
    <title>Jorge Espinal · Portafolio</title>
    <script>
      // Aplica el tema antes de pintar la página para evitar un destello de color.
      // Debe coincidir con `detectTheme` y la clave de `src/shared/theme/theme.ts`.
      try {
        var stored = localStorage.getItem('portfolio.theme')
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        if (stored === 'dark' || (stored !== 'light' && prefersDark)) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
